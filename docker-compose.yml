# Vednix AI — backend + web workspace.
#   docker compose up                          → API + frontend
#   docker compose --profile research up       → adds SearXNG
#   docker compose --profile scale up          → adds Postgres + Redis
# Gemini/Groq keys are entered in Settings and encrypted in the backend DB.
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      VEDNIX_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      VEDNIX_SEARXNG_URL: ${VEDNIX_SEARXNG_URL:-http://searxng:8080}
      VEDNIX_DATA_DIR: ${VEDNIX_DATA_DIR:-/app/data}
      VEDNIX_DATABASE_URL: ${VEDNIX_DATABASE_URL:-sqlite+aiosqlite:///./data/vednix.db}
      VEDNIX_SECRET_KEY: ${VEDNIX_SECRET_KEY:-}
      VEDNIX_REDIS_URL: ${VEDNIX_REDIS_URL:-}
      VEDNIX_AUTH_TOKEN: ${VEDNIX_AUTH_TOKEN:-}
    volumes:
      - vednix-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_WS_BASE: ws://localhost:8000/ws/chat
    environment:
      VEDNIX_BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

  searxng:
    image: searxng/searxng:latest
    profiles: ["research"]
    ports: ["8080:8080"]
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    volumes:
      - searxng-config:/etc/searxng

  postgres:
    image: postgres:17-alpine
    profiles: ["scale"]
    environment:
      POSTGRES_USER: vednix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: vednix
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["scale"]

volumes:
  vednix-data:
  searxng-config:
  pg-data:
